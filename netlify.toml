# Static site: no build step, publish the repo root.
[build]
  publish = "."
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"

# Short cache for page/scripts so edits (e.g. config.js) show up quickly
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=300"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Short links to share: /boys and /girls open the matching form
[[redirects]]
  from = "/boys"
  to = "/?for=boys"
  status = 302

[[redirects]]
  from = "/girls"
  to = "/?for=girls"
  status = 302
